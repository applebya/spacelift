    <!--
      Structured data. Lives in the HTML shell rather than in the React tree so
      crawlers see it without executing JavaScript.

      Deliberately contains no postal address and no telephone: Spacelift is
      operated from the owner's home, and neither is published anywhere on the
      site. A service-area business should not publish a residential address,
      and Google's own guidance is to express coverage with `areaServed`
      instead. Every value below is already stated publicly on this page.

      Deliberately omitted, and why:
      - `aggregateRating` — the nine testimonials carry no numeric ratings, and
        the five-star graphic is a marketing claim, not an aggregation. Inventing
        a ratingValue and reviewCount would be fabricated data and risks a
        manual action.
      - `review` — Google does not allow a business to mark up reviews about
        itself on its own site.
      Both need a real review source (e.g. a Google Business Profile) to be
      done honestly. See docs/session-handoff.md.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "ProfessionalService",
            "@id": "https://spacelift.online/#business",
            "name": "Spacelift",
            "url": "https://spacelift.online/",
            "description": "Complete transformation design service for homes, businesses and real estate \u2014 decluttering, organizing, painting, cleaning, staging and merchandising.",
            "slogan": "Transforming Spaces",
            "image": "https://spacelift.online/og-image.jpg",
            "logo": "https://spacelift.online/wordmark.png",
            "areaServed": {
              "@type": "Place",
              "name": "Southern Vancouver Island, British Columbia, Canada"
            },
            "founder": {
              "@type": "Person",
              "name": "Rosemarie Root",
              "jobTitle": "Certified Professional Organizer"
            },
            "knowsAbout": [
              "Decluttering",
              "Home organization",
              "Interior painting",
              "Deep cleaning",
              "Home staging",
              "Retail merchandising"
            ],
            "makesOffer": {
              "@type": "Offer",
              "priceSpecification": {
                "@type": "UnitPriceSpecification",
                "price": 75,
                "priceCurrency": "CAD",
                "unitCode": "HUR",
                "description": "From $75.00 per hour, three hour minimum."
              }
            },
            "sameAs": [
              "https://www.facebook.com/profile.php?id=61560538700519",
              "https://www.instagram.com/spaceliftonline/"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://spacelift.online/#website",
            "url": "https://spacelift.online/",
            "name": "Spacelift",
            "inLanguage": "en-CA",
            "publisher": { "@id": "https://spacelift.online/#business" }
          }
        ]
      }
    </script>
