<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found • Spacelift</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <style>
      /*
        Served by GitHub Pages for any unknown path, without the application
        bundle, so everything it needs is inline or at a stable URL. System
        fallbacks are used deliberately: loading a webfont for an error page is
        not worth the request.
      */
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2rem;
        padding: 2rem;
        text-align: center;
        background: #fff;
        color: #374151;
        font-family: 'Times New Roman', Times, serif;
      }
      img {
        width: min(280px, 70vw);
        height: auto;
      }
      h1 {
        margin: 0;
        font-size: clamp(1.5rem, 5vw, 2.25rem);
        font-weight: 400;
        letter-spacing: 0.05em;
        line-height: 1.5;
      }
      p {
        margin: 0;
        max-width: 34rem;
        line-height: 1.75;
        letter-spacing: 0.05em;
        font-weight: 300;
      }
      a.home {
        font-family: Arial, Helvetica, sans-serif;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid #1f2937;
        background: #fffbeb;
        padding: 0.75rem 3rem;
        font-size: 1rem;
        text-transform: uppercase;
        letter-spacing: 0.2em;
        color: #374151;
        text-decoration: none;
        transition: background-color 150ms;
      }
      a.home:hover {
        background: #f3f4f6;
      }
      a.home:focus-visible {
        outline: 2px solid #1f2937;
        outline-offset: 2px;
      }
      footer {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 0.75rem;
        letter-spacing: 0.3em;
        color: #9ca3af;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <img src="/wordmark.png" width="420" height="228" alt="Spacelift" />
    <h1>We couldn&rsquo;t find that page.</h1>
    <p>
      The link may be out of date, or the page may have moved. Everything
      Spacelift offers lives on our home page.
    </p>
    <a class="home" href="/">Back to Spacelift</a>
    <footer>Transforming Spaces</footer>
  </body>
</html>
